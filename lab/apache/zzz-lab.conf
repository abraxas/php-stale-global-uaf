ServerName 127.0.0.1
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5
Timeout 15

<Directory /var/www/html>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
    # Per-dir INI is applied in apply_config() before php_request_startup().
    php_flag auto_detect_line_endings on
    php_flag report_memleaks off
</Directory>
